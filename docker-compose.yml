services:
  postgres:
    image: postgres:16-alpine
    container_name: pw-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pw_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pw_os_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pw_os"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pw_os_postgres_data:
